# ~/.config/foot/foot.ini
# Hyprland + Caelestia + CachyOS setup

# ============================
#  Main Settings
# ============================
shell        = fish
title        = foot

# Font
font         = Operator Mono:size=14
# font       = JetBrains Mono Nerd Font:size=12

letter-spacing         = 0
dpi-aware              = no
pad                    = 25x25
bold-text-in-bright    = no
gamma-correct-blending = no


# ============================
#  Scrollback
# ============================
[scrollback]
lines = 10000


# ============================
#  Cursor
# ============================
[cursor]
style          = beam
beam-thickness = 1.5


# ============================
#  Colors (Dark theme)
# ============================
[colors-dark]
alpha      = 0.78
alpha-mode = all
blur       = yes


# ============================
#  Key Bindings
# ============================
[key-bindings]
scrollback-up-page   = Page_Up
scrollback-down-page = Page_Down
search-start         = Control+Shift+f


# ============================
#  Search Bindings
# ============================
[search-bindings]
cancel    = Escape
find-prev = Shift+F3
find-next = F3 Control+G
